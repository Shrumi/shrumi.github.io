<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suno Parser - отчёты</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#151410">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#151410; --panel:#1e1c17; --line:#332f27; --ink:#f3ede1; --muted:#a99e8b;
    --accent:#b8432c; --ok:#3f7f4a; --warn:#c9a227;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:16px 14px 32px;max-width:720px;margin:0 auto}
  h1{font-size:19px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  button{font:inherit;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);padding:11px 14px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  input{font:inherit;width:100%;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);padding:10px 12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .row > *{flex:1 1 160px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin:0 0 10px}
  .card h2{font-size:15px;margin:0 0 4px;word-break:break-all}
  .meta{color:var(--muted);font-size:12.5px}
  .files{list-style:none;margin:10px 0 0;padding:0}
  .files li{border-top:1px solid var(--line);padding:9px 0}
  .files a{color:var(--ink);text-decoration:none;display:flex;justify-content:space-between;gap:10px}
  .files a span{color:var(--accent)}
  .status{font-size:13px;color:var(--muted);min-height:20px;margin:0 0 10px}
  .warn{background:rgba(201,162,39,.12);border:1px solid var(--warn);
    color:#e6d08a;border-radius:12px;padding:10px 12px;font-size:13px;margin:0 0 14px}
  .badge{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 8px;border-radius:999px;background:rgba(63,127,74,.16);color:#8fd39a}
  code{font-size:12.5px;color:var(--warn);word-break:break-all}
</style>
</head>
<body>
<h1>Suno Parser</h1>
<p class="sub" id="sub">Отчёты с компьютера в вашей сети</p>

<div id="cert" class="warn" hidden>
  <b>Нужен разовый приём сертификата.</b> Откройте адрес по HTTPS, чтобы браузер
  разрешил запросы. <a id="certLink" href="#" style="color:#e6d08a">https://…</a>,
  затем «Дополнительно» → «Перейти на сайт».
</div>

<div class="row" id="manual">
  <input id="host" inputmode="numeric" placeholder="IP компьютера, например 192.168.186.5">
  <button class="primary" id="scan">Найти отчёты</button>
</div>
<button id="install" hidden style="margin-bottom:14px">Установить приложение</button>
<p class="status" id="status">Ищу сервер парсера…</p>
<div id="list"></div>

<script>
const PORTS = [8774, 8765, 8766, 8767, 8768, 8769, 8770, 8771, 8772, 8773, 8775];
const statusEl = document.getElementById('status');
const listEl = document.getElementById('list');
const certEl = document.getElementById('cert');
const certLink = document.getElementById('certLink');
const hostInput = document.getElementById('host');
const manualRow = document.getElementById('manual');

function ping(url, ms = 900) {
  return new Promise((resolve) => {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms);
    fetch(url, { signal: ctl.signal, mode: 'cors', cache: 'no-store' })
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => { clearTimeout(t); resolve(j && j.app === 'suno-report' ? j : null); })
      .catch(() => { clearTimeout(t); resolve(null); });
  });
}

// The same page is served by the parser itself (http://<ip>:8774/) and from
// GitHub Pages. On the parser origin we already know the address: no scan.
async function bootstrap() {
  const here = location.protocol + '//' + location.host;
  if (location.port === '8774' || location.port === '8775' || location.protocol === 'http:' && location.port) {
    const info = await ping(here + '/__suno/ping', 2500);
    if (info) { renderServer({ scheme: location.protocol.replace(':', ''), ip: location.hostname, port: location.port, info }); return; }
  }
  const saved = (() => { try { return localStorage.getItem('suno.host') || ''; } catch (e) { return ''; } })();
  if (saved) hostInput.value = saved;
  statusEl.textContent = 'Введите IP компьютера с парсером — или откройте приложение по адресу http://IP:8774/';
}

async function probeHost(ip) {
  const clean = String(ip || '').trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
  if (!clean) return null;
  for (const port of PORTS) {
    const scheme = (port === 8765 || port === 8774) ? 'http' : 'https';
    const info = await ping(scheme + '://' + clean + ':' + port + '/__suno/ping');
    if (info) return { scheme, ip: clean, port, info };
    if (scheme === 'https' && !certEl.dataset.shown) {
      certEl.dataset.shown = '1';
      certEl.hidden = false;
      certLink.href = 'https://' + clean + ':' + port;
      certLink.textContent = 'https://' + clean + ':' + port;
    }
  }
  return null;
}

async function findServer() {
  const btn = document.getElementById('scan');
  btn.disabled = true;
  listEl.innerHTML = '';
  const ip = hostInput.value.trim();
  statusEl.textContent = ip ? 'Проверяю ' + ip + '…' : 'Укажите IP компьютера';
  const found = ip ? await probeHost(ip) : null;
  btn.disabled = false;
  if (!found) {
    statusEl.textContent = ip
      ? 'Сервер не найден. Проверьте, что парсер запущен и телефон в той же сети.'
      : 'Введите IP компьютера с парсером.';
    return;
  }
  renderServer(found);
}

function renderServer(f) {
  listEl.innerHTML = '';
  const base = f.scheme + '://' + f.ip + ':' + f.port + '/';
  const pwaBase = f.info.pwa ? f.scheme + '://' + f.ip + ':' + f.info.pwa + '/' : base;
  try { localStorage.setItem('suno.host', f.ip); } catch (e) {}
  statusEl.textContent = 'Сервер найден: ' + f.ip + ':' + f.port;
  const files = (f.info.files || []);
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    '<h2>' + f.ip + ' <span class="badge">' + (f.info.pwa ? 'PWA' : 'отчёты') + '</span></h2>' +
    '<div class="meta">' + files.length + ' отчётов · ' + base + '</div>' +
    '<ul class="files">' + files.map((n) =>
      '<li><a href="' + base + encodeURIComponent(n) + '" target="_blank" rel="noopener">' +
      n + '<span>открыть →</span></a></li>').join('') + '</ul>' +
    (pwaBase !== base ? '<p class="meta" style="margin-top:10px">Адрес приложения: <code>' + pwaBase + '</code></p>' : '');
  listEl.appendChild(card);
}

document.getElementById('scan').addEventListener('click', findServer);
hostInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') findServer(); });

let deferred = null;
const installBtn = document.getElementById('install');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferred = e; installBtn.hidden = false;
});
installBtn.addEventListener('click', async () => {
  if (!deferred) return;
  deferred.prompt(); await deferred.userChoice; deferred = null; installBtn.hidden = true;
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
bootstrap();
</script>
</body>
</html>
